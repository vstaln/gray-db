[package]
name = "gray-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "SQLite database tools for the gray agent harness"
license = "MIT"
[lib]
name = "db_plugin"
path = "src/lib.rs"
[[bin]]
name = "db"
path = "src/main.rs"
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
